name: Reshuffle words.json

# Publishes a fresh random subset from words.master.json each week so the live
# word set on the TRMNL rotates over time. No API calls here — publish.py only
# reshuffles the already-built master pool.

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  reshuffle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reshuffle
        run: python3 publish.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- words.json; then
            echo "No change to words.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add words.json
          git commit -m "Reshuffle live word set"
          git push
